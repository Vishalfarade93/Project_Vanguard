spring.application.name=predictive-budgeting
server.port=8080

# ─────────────────────────────────────────────────────────────
# Database  (H2 in-memory for dev — swap for PostgreSQL in prod)
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ─────────────────────────────────────────────────────────────
# AI — Google Gemini API
# Get your key at: https://makersuite.google.com/app/apikey
# ─────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ─────────────────────────────────────────────────────────────
# Slack OAuth 2.0
# Create a Slack App at: https://api.slack.com/apps
# ─────────────────────────────────────────────────────────────
slack.oauth.client-id=${SLACK_CLIENT_ID:YOUR_SLACK_CLIENT_ID_HERE}
slack.oauth.client-secret=${SLACK_CLIENT_SECRET:YOUR_SLACK_CLIENT_SECRET_HERE}
slack.oauth.redirect-uri=${SLACK_REDIRECT_URI:http://localhost:8080/api/slack/oauth/callback}
slack.oauth.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ─────────────────────────────────────────────────────────────
# JWT Authentication
# ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-chars}
jwt.expiration-ms=86400000

# ─────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────
logging.level.com.vanguard.predictivebudget=INFO
